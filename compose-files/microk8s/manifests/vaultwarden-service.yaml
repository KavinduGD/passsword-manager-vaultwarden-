apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-external
  namespace: vaultwarden

spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vaultwarden-external
  namespace: vaultwarden

subsets:
  - addresses:
      - ip: 172.31.15.157
    ports:
      - name: http
        port: 8080
        protocol: TCP
